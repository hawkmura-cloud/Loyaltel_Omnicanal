services:
  # MySQL Database
  mysql:
    image: mysql:8.4
    container_name: claro_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: claro_root_2026
      MYSQL_DATABASE: claro_chatbot
      MYSQL_USER: claro_app
      MYSQL_PASSWORD: claro_app_2026
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pclaro_root_2026"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Node.js
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: claro_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=claro_chatbot
      - DB_USER=claro_app
      - DB_PASSWORD=claro_app_2026
      - JWT_SECRET=${JWT_SECRET:-claro_chatbot_jwt_secret_2026_prod_secure_key_random_string}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-8h}
    depends_on:
      mysql:
        condition: service_healthy

  # Frontend PHP
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: claro_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data: