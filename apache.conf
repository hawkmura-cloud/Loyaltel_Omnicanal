<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Proxy a backend Node.js
    ProxyPreserveHost On
    ProxyRequests Off

    # Soporte para Server-Sent Events (SSE) sin buffering
    <Location /api/panel/sse>
        ProxyPass http://backend:3000/api/panel/sse flushpackets=on
        ProxyPassReverse http://backend:3000/api/panel/sse
    </Location>

    # Proxy general para endpoints de la API
    ProxyPass /api http://backend:3000/api
    ProxyPassReverse /api http://backend:3000/api

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
